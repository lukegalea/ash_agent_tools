# These checks are the ones ash-project's shared `ash-ci.yml` runs, written out
# here instead of called.
#
# The shared workflow's credo job declares `permissions: security-events: write`
# — and a job-level permissions block *replaces* the default set rather than
# adding to it, so that job's token has no `contents: read`. On a public repo
# actions/checkout needs no token and nobody notices; on a private one it fails
# with "Repository not found", and a caller cannot grant back a permission the
# called workflow dropped. So the shared workflow only stays green while this
# repository stays public; this copy keeps working either way.
#
# Keep this file in step with upstream when adopting new checks. Its Credo SAST
# upload is deliberately omitted: code scanning uploads need GitHub Advanced
# Security, which private repositories do not have by default.

name: Elixir CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  MIX_ENV: test

jobs:
  test:
    name: mix test
    runs-on: ubuntu-latest
    # The BPMN/decision tooling tests run the real ash_bpmn/ash_decisions
    # resource macros, which are AshPostgres by construction, against a
    # sandboxed TestRepo. Everything else in the suite needs no database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      # The DMN compiler shells out to `xmllint` (boxic_dmn validates DMN
      # documents against the normative XSD through it). Without it on PATH
      # every decision fixture fails to load.
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      # Regression guard for AST-150. Under these seeds the decision tooling
      # tests failed: the first DMN publish of the run timed out its FEEL
      # parse while the engine's modules were still loading. The failure
      # depends on timing as well as order, so a pass here is a guard, not
      # proof. The random-seed run below writes the uploaded JUnit report.
      - name: mix test (seeds that exposed AST-150)
        run: |
          mix test --seed 990638
          mix test --seed 118424
      - run: mix test
      # The JUnit XML evidence that .sdlc/verification.yaml declares
      # (report.path). junit_formatter writes it on every run; a missing
      # report fails this job instead of passing without evidence.
      - name: Upload JUnit test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-test-report
          path: test/reports/junit/*.xml
          if-no-files-found: error

  # TEMPORARY (AST-150 AC-2 evidence). Runs the full suite under 20
  # consecutive random seeds and uploads each run's JUnit report. The next
  # commit reverts this job; the run id it produced is cited in
  # .sdlc/acceptance/AST-150.yaml.
  twenty-seeds:
    name: mix test x20 random seeds (AST-150 AC-2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          TZ: UTC
          PGTZ: UTC
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: mix test under 20 consecutive random seeds
        run: |
          mkdir -p seed-reports
          failed=0
          echo "| run | seed | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 20); do
            seed=$(shuf -i 0-999999 -n 1)
            echo "::group::run $i seed $seed"
            if mix test --seed "$seed" 2>&1 | tee "seed-reports/run-$i-seed-$seed.log"; status=${PIPESTATUS[0]}; [ "$status" -eq 0 ]; then
              result=pass
            else
              result="FAIL (exit $status)"
              failed=$((failed + 1))
            fi
            cp test/reports/junit/junit_report.xml "seed-reports/run-$i-seed-$seed.xml" || true
            summary=$(grep -E '[0-9]+ doctests?, [0-9]+ tests?, [0-9]+ failures?' "seed-reports/run-$i-seed-$seed.log" | tail -1 || true)
            echo "| $i | $seed | $result: $summary |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            echo "run $i seed $seed: $result: $summary"
          done
          echo "failed runs: $failed of 20" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
      - name: Upload per-seed JUnit reports and logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ast-150-twenty-seeds
          path: seed-reports/
          if-no-files-found: error

  compile-test:
    name: MIX_ENV=test mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix compile --force --warnings-as-errors

  compile-dev:
    name: MIX_ENV=dev mix compile --warnings-as-errors
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      # dev is also where the analysis and docs tooling itself compiles
      # (credo, dialyxir, ex_doc), so its warnings surface here too.
      - run: mix compile --force --warnings-as-errors

  format:
    name: mix format --check-formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix format --check-formatted

  credo:
    name: mix credo --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix credo --strict

  dialyzer:
    name: mix dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      # No plt_file is configured, so dialyxir keeps the PLT under _build —
      # already restored by the setup action's cache, keyed by mix.lock.
      - run: mix dialyzer --format short

  docs:
    name: mix docs
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          mix-env: dev
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix docs

  unused-deps:
    name: mix deps.unlock --check-unused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix deps.unlock --check-unused

  audit:
    name: mix deps.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix deps.audit

  # `mix deps.audit` (mix_audit) reads its own advisory database and has
  # reported "No vulnerabilities found" while Hex's advisory feed flagged
  # locked packages (SDLC-96). `mix hex.audit` checks the lock against Hex's
  # retirements and security advisories, so both gates run.
  hex-audit:
    name: mix hex.audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-elixir
        with:
          deps-token: ${{ secrets.PRIVATE_DEPS_TOKEN }}
      - run: mix hex.audit

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: fsfe/reuse-action@v6
