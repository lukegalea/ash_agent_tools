version = 1

# Source files carry their own SPDX header; this annotation covers everything
# else (config, docs, dotfiles) so `reuse lint` stays clean.
[[annotations]]
path = [
  ".formatter.exs",
  ".gitignore",
  "REUSE.toml",
  "mix.exs",
  "mix.lock",
  "README.md",
  "usage-rules.md",
  "test/fixtures/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 ash_agent_tools contributors <https://github.com/lukegalea/ash_agent_tools>"
SPDX-License-Identifier = "MIT"
